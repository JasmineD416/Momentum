# Streams every database change to Akamai Object Storage. Restore with: docker compose run --rm backup restore -o /data/restored.db /data/momentum.db
dbs:
  - path: /data/momentum.db
    replicas:
      - type: s3
        bucket: ${BACKUP_BUCKET}
        path: momentum
        endpoint: ${BACKUP_ENDPOINT}
        force-path-style: true
        retention: 720h
        snapshot-interval: 24h