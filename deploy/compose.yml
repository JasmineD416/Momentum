# Runs on the Akamai server in /opt/momentum (copied there by the GitHub deploy workflow). Settings come from /opt/momentum/.env.
services:
  app:
    image: ${MOMENTUM_IMAGE:?set MOMENTUM_IMAGE in .env}:${MOMENTUM_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    expose:
      - "8787"

  # HTTPS certificates (Let's Encrypt) and the public entrance on ports 80/443.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      MOMENTUM_DOMAIN: ${MOMENTUM_DOMAIN:?set MOMENTUM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Continuous backup of the database to Akamai Object Storage (every change, within about a second).
  backup:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY:?set BACKUP_ACCESS_KEY in .env}
      LITESTREAM_SECRET_ACCESS_KEY: ${BACKUP_SECRET_KEY:?set BACKUP_SECRET_KEY in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy_data:
  caddy_config: