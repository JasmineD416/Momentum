# Runs on the Akamai server in /opt/momentum (copied there by scripts/deploy.sh). Settings come from /opt/momentum/.env.
services:
  app:
    # Built on the server from the code in /opt/momentum/src.
    build: ./src
    image: momentum:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    expose:
      - "8787"

  # HTTPS certificates (Let's Encrypt) and the public entrance on ports 80/443.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      MOMENTUM_DOMAIN: ${MOMENTUM_DOMAIN:?set MOMENTUM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Continuous backup of the database to Akamai Object Storage (every change, within about a second).
  # Turned on by COMPOSE_PROFILES=backup in .env once the storage key is filled in.
  backup:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    profiles: [backup]
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${BACKUP_SECRET_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_ENDPOINT: ${BACKUP_ENDPOINT}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy_data:
  caddy_config: