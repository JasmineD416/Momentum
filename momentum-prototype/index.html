<title>Momentum Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C14B8A; --violet:#7952A5; --ink:#141216; --muted:#6b6670; --line:#ebe7ee; --soft:#faf8fb; --tint:#f6eff5;
  --bg:#fff; --ok:#2f7d4f; --okbg:#e8f4ec; --warn:#9a5b00; --warnbg:#fff3e0; --bad:#b3261e; --badbg:#fdecea; --info:#5b3f86; --infobg:#f1ecf8;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--violet)}
h1,h2,h3,h4{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Brand */
.wordmark{font-family:Montserrat,Inter,sans-serif;font-weight:600;letter-spacing:.32em;color:#000;line-height:1}
.byline{font-family:Allura,cursive;font-weight:400;line-height:1.1;background:linear-gradient(100deg,#8e2f63 0%,#C14B8A 20%,#f1bcd9 38%,#a77fd0 55%,#7952A5 72%,#d6c3ee 86%,#5b3a83 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);letter-spacing:.04em}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.login-card{width:100%;max-width:560px;text-align:center}
.login .wordmark{font-size:clamp(34px,8vw,56px)}
.login .byline{font-size:clamp(30px,6vw,40px);margin-top:6px}
.login .tagline{margin-top:6px;font-size:15px}
.qcard{margin:32px auto 28px;padding:22px 24px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff, var(--soft));position:relative}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,var(--pink),var(--violet))}
.qcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.qcard blockquote{margin:8px 0 0;font-size:19px;font-weight:500}
.who{display:grid;gap:8px;text-align:left}
.who button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer}
.who button:hover{border-color:var(--pink);background:var(--soft)}
.who small{color:var(--muted)}
.proto{font-size:12px;color:var(--muted);margin-top:18px}

/* Shell */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:#fff;display:flex;flex-direction:column}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .wordmark{font-size:20px}
.brand .byline{font-size:19px;margin-top:6px;white-space:nowrap}
.navg{margin:12px 0 4px}
.navg h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 8px 6px;display:flex;align-items:center;gap:6px}
.lock{font-size:10px;letter-spacing:.04em;text-transform:none;padding:1px 6px;border-radius:99px;background:var(--infobg);color:var(--info)}
.navg a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.navg a:hover{background:var(--soft)}
.navg a.on{background:var(--tint);color:#000;font-weight:600;box-shadow:inset 3px 0 0 var(--pink)}
.navsub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);padding:12px 10px 4px}
.count{min-width:20px;padding:0 6px;border-radius:99px;background:var(--pink);color:#fff;font-size:11px;font-weight:600;text-align:center;line-height:18px}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line)}
.side-foot .me{font-weight:600}
.side-foot .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
main{padding-block:26px 60px;padding-left:max(34px,env(safe-area-inset-left,0px));padding-right:max(34px,env(safe-area-inset-right,0px));min-width:0}
.mbar{display:none;align-items:center;justify-content:space-between;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:#fff;z-index:15}
.mbar .wordmark{font-size:16px}
.banner{font-size:12px;color:var(--info);background:var(--infobg);border-radius:8px;padding:7px 12px;margin-bottom:18px}
.scrim{display:none}
.hero-img{display:block;width:100%;max-width:100%;height:clamp(96px,16vw,190px);object-fit:cover;border-radius:14px;margin-bottom:20px;background:var(--tint)}
.login-hero{display:block;width:100%;max-width:100%;height:clamp(110px,22vw,170px);object-fit:cover;border-radius:16px;margin-bottom:26px;background:var(--tint)}

/* Page header */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;margin-bottom:6px}
.crumb a{text-decoration:none}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#d5cfd9;background:var(--soft)}
.btn.primary{background:#111;border-color:#111;color:#fff}
.btn.primary:hover{background:#2a2530}
.btn.accent{background:linear-gradient(100deg,var(--pink),var(--violet));border:0;color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.icon-btn{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:360px}
.toolbar label.chk{display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.tabs button.on{background:#111;color:#fff;border-color:#111}

/* Cards / tiles */
.card{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
a.tile:hover{border-color:var(--pink)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v.small{font-size:16px}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols2>*{min-width:0}
.quote-card{background:linear-gradient(160deg,#fff 0%,var(--tint) 100%)}
.quote-card blockquote{margin:0;font-size:20px;font-weight:500}
.quote-card .byline{font-size:24px;margin-top:10px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.infobox{background:var(--infobg);color:var(--info);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}

/* Table */
.tblwrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td a.name{font-weight:600;text-decoration:none;color:var(--ink)}
td a.name:hover{color:var(--pink)}
tr.voided td{color:var(--muted)}
tr.voided td.num{text-decoration:line-through}
tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.acts-cell{display:flex;gap:6px;justify-content:flex-end;align-items:center}
tfoot td{font-weight:600;background:var(--soft);border-top:1px solid var(--line)}

/* Pills */
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--infobg);color:var(--info);border-color:transparent}
.pill.pink{background:#fbe9f3;color:#9b2f6c;border-color:transparent}
.tags{display:flex;gap:4px;flex-wrap:wrap}

/* Definition list */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 20px;margin:0}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:2px 0 0;word-break:break-word}
.dl-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);margin:18px 0 8px;font-weight:600}
.dl-h:first-child{margin-top:0}

/* Alerts */
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);margin-top:7px;flex:none}
.alist li.read .dot{background:var(--line)}
.alist li.read .t{color:var(--muted);font-weight:500}
.alist .t{font-weight:600}
.alist .d{color:var(--muted);font-size:13px}
.alist .grow{flex:1;min-width:0}
.alist .btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:10px 0 10px 18px;border-left:2px solid var(--line);position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--violet)}
.tl .m{font-size:12px;color:var(--muted)}

/* Calendar */
.cal{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:780px}
.cal-grid .dow{background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.cal-grid .day{min-height:112px;padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cal-grid .day:nth-child(7n){border-right:0}
.cal-grid .day.out{background:#fcfbfd;color:#b9b3bd}
.cal-grid .day.today .n{background:#111;color:#fff;border-radius:99px;padding:0 7px}
.cal-grid .n{font-size:12px;font-weight:600;display:inline-block;margin-bottom:4px}
.chip{display:block;font-size:11.5px;padding:2px 6px;border-radius:5px;margin-bottom:3px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);background:var(--soft);border-left:3px solid var(--line)}
.chip.campaign{border-left-color:var(--violet);background:var(--infobg)}
.chip.work{border-left-color:#111}
.chip.follow{border-left-color:var(--pink);background:#fbe9f3}
.chip.firm{border-left-color:var(--warn);background:var(--warnbg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* Forms */
dialog.modal{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(20,10,30,.25)}
dialog.modal.narrow{width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,14,26,.42)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
dialog header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
dialog header h2{font-size:17px}
dialog .body{padding:18px 20px;overflow:auto}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
dialog .err{color:var(--bad);margin:0;padding:0 20px;font-weight:500}
dialog .err:empty{display:none}
dialog .err:not(:empty){padding-bottom:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full,.fgrid .fh{grid-column:1/-1}
.fgrid .fh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);font-weight:600;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.fgrid .fh:first-child{margin-top:0;padding-top:0;border-top:0}
.field label,.field .lbl{font-size:12.5px;font-weight:500;color:#3b3540}
.field .req{color:var(--pink)}
.field input:not([type=checkbox]),.field select,.field textarea{padding:8px 10px;border:1px solid #ddd6e1;border-radius:8px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field small{color:var(--muted);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.multi{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 0}
.report-form .field{margin-bottom:12px}
.report-form textarea{min-height:64px}

@media (max-width:980px){.cols2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-102%);transition:transform .2s;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.12)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(20,14,26,.3);z-index:25}
  .mbar{display:flex}
  main{padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fgrid{grid-template-columns:1fr}
  .toolbar input[type=search]{min-width:0;max-width:none;width:100%}
}
</style>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Momentum — clickable prototype
   Fictional sample data only, stored in this browser (localStorage).
   No real sign-in and no server: access rules are simulated in the page.

const KEY = 'momentum-prototype-v2';
const BRANDS = ['Law Girl', 'JD&Co', 'CBPLA', 'LendCheck', 'Lend Ready'];
// Company divisions. Each staff member is granted the divisions they work on.
const DIVISIONS = [
  { id: 'jdco', name: 'JD&Co Law Firm' }, { id: 'marketing', name: 'Marketing' }, { id: 'lawgirl', name: 'Law Girl' },
  { id: 'plstack', name: 'The Private Lenders Stack' }, { id: 'cbpla', name: 'CBPLA' }, { id: 'publishing', name: 'JD Publishing' },

const DIV = Object.fromEntries(DIVISIONS.map(d => [d.id, d]));
// Only Jasmine can grant these divisions.
const RESTRICTED = ['jdco', 'accounting', 'publishing'];
// Document folders. Items are titles with Box links; a folder with no division is open to all staff.
const FOLDERS = [
  { id: 'hr', name: 'Human Resources', area: 'Office', div: null, hero: 'office', about: 'Policies, forms and staff documents.' },
  { id: 'sops', name: 'SOPs & Templates', area: 'Office', div: null, hero: 'office', about: 'Standard operating procedures and reusable templates.' },
  { id: 'pl-series', name: 'The Private Lenders Series', area: 'JD Publishing', div: 'publishing', hero: 'client-expenses', about: 'Manuscripts, drafts and production files for the series.' },
  { id: 'lg-series', name: 'Law Girl Series', area: 'JD Publishing', div: 'publishing', hero: 'client-expenses', about: 'Manuscripts, drafts and production files for the series.' },
  { id: 'cookbooks', name: 'JD in the Kitchen Cookbooks', area: 'JD Publishing', div: 'publishing', hero: 'client-expenses', about: 'Recipes, manuscripts and photography for the cookbooks.' },
];
const FOLDER = Object.fromEntries(FOLDERS.map(f => [f.id, f]));
const CURS = ['CAD', 'USD'];
const PIPES = {
  'Software sales': ['Inquiry', 'Demo', 'Proposal', 'Negotiation', 'Won', 'Lost'],
  'CBPLA memberships': ['Interested', 'Contacted', 'Application', 'Won', 'Lost'],
  'Sponsorships': ['Prospect', 'Pitched', 'Negotiating', 'Won', 'Lost'],
  'Partnerships': ['Exploring', 'Discussing', 'Agreement', 'Won', 'Lost'],
  'Podcast and media': ['Idea', 'Invited', 'Scheduled', 'Won', 'Lost'],
  'Speaking': ['Lead', 'Submitted', 'Confirmed', 'Won', 'Lost'],
};
const TASK_STATUS = ['Planned', 'In progress', 'Ready for review', 'Approved', 'Published', 'Completed'];
const CHECKLIST = [
  ['Conflicts', 'Conflict review recorded'],
  ['Retainer', 'Signed retainer and scope reviewed'],
  ['Client details', 'Client contact and identity details reviewed'],
  ['Responsibility', 'File number, lawyer and staff assigned'],
  ['Dates', 'Key dates reviewed by responsible lawyer'],
  ['Notices', 'Notice requirements reviewed by responsible lawyer'],
  ['Documents', 'File folder and document access prepared'],
  ['Next steps', 'Initial records requests and next steps planned'],
];
const CASE_TYPES = ['Motor vehicle accident', 'Slip and fall', 'Long-term disability', 'Mortgage or lending dispute', 'Real estate', 'Employment', 'Other'];
// Placeholder quote bank (31). The live app's bank lives in lib/policy.ts.
const QUOTES = [
  'Bold ambition creates limitless possibility.',
  'Momentum is built one deliberate step at a time.',
  'Small wins, repeated daily, become big results.',
  'Clarity first. Speed follows.',
  'Make the hard call before lunch.',
  'Every follow-up is a promise kept.',
  'Consistency outworks talent that rests.',
  'Lead with care; close with confidence.',
  'Progress loves a plan and a deadline.',
  'Make it simple, then make it happen.',
  'Your next client is one conversation away.',
  'Ambition is a decision you make every morning.',
  'Done well beats done perfectly.',
  'Be the reason someone’s day gets easier.',
  'Great teams share the load and the credit.',
  'Start before you feel ready.',
  'Details build trust.',
  'Focus means saying no to the good for the great.',
  'Energy is contagious. Bring yours.',
  'Momentum favours the prepared.',
  'Turn every no into a next step.',
  'Show up, follow through, lift others.',
  'Big goals need small daily rituals.',
  'The best time to follow up is now.',
  'Confidence comes from doing the work.',
  'Courage is the first line item of growth.',
  'Excellence is a habit, not an event.',
  'Write it down. Then get it done.',
  'Momentum is a team sport.',
  'Finish strong; tomorrow starts tonight.',
  'Keep going. You are closer than you think.',
];

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const nowISO = () => new Date().toISOString();
const nyFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => nyFmt.format(new Date());
const nyHour = () => Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
function shift(ds, n) { const d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const addDays = n => shift(today(), n);
const dow = ds => new Date(ds + 'T00:00:00Z').getUTCDay(); // 0 = Sunday
const mondayOf = ds => shift(ds, -((dow(ds) + 6) % 7));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00Z'));

function load() { try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: keep working in memory */ } }
const byId = (col, id) => S[col].find(r => r.id === id);

const activeMembers = firmOnly => S.members.filter(m => m.active && (!firmOnly || hasFirm(m)));

function log(action, entity, scope = 'general') {

  if (S.audit.length > 300) S.audit.length = 300;
}
function upsert(col, rec) {
  if (rec.id && byId(col, rec.id)) {
    const i = S[col].findIndex(r => r.id === rec.id);
    S[col][i] = { ...S[col][i], ...rec, updatedAt: nowISO(), updatedBy: me()?.id, rev: (S[col][i].rev || 0) + 1 };
    save(); return S[col][i];
  }
  const r = { ...rec, id: rec.id || uid(), createdAt: nowISO(), createdBy: rec.createdBy || me()?.id, rev: 1 };
  S[col].push(r); save(); return r;
}

/* ---------- forms ---------- */
function fieldHtml(f, v) {
  if (f.t === 'h') return `<div class="fh">${esc(f.l)}</div>`;
  const id = 'f_' + f.k;
  const opts = typeof f.o === 'function' ? f.o() : (f.o || []);
  const lab = `<label for="${id}">${esc(f.l)}${f.req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>`;
  let input;
  switch (f.t) {
    case 'select':
      input = `<select id="${id}" name="${f.k}"${f.req ? ' aria-required="true"' : ''}>${f.blank === false ? '' : `<option value="">${esc(f.ph || '—')}</option>`}${opts.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${String(v ?? '') === String(val) ? ' selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>`; break;
    case 'textarea': input = `<textarea id="${id}" name="${f.k}" rows="${f.rows || 3}">${esc(v)}</textarea>`; break;
    case 'money': input = `<input id="${id}" name="${f.k}" inputmode="decimal" placeholder="0.00" value="${v != null && v !== '' ? (v / 100).toFixed(2) : ''}">`; break;
    case 'check': return `<div class="field${f.full ? ' full' : ''}"><span class="lbl">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</span><label class="chk"><input type="checkbox" id="${id}" name="${f.k}"${v ? ' checked' : ''}> ${esc(f.cl || 'Yes')}</label>${f.help ? `<small>${esc(f.help)}</small>` : ''}</div>`;
    case 'multi': return `<div class="field full"><span class="lbl">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</span><div class="multi">${opts.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(val)}"${(v || []).includes(val) ? ' checked' : ''}> ${esc(txt)}</label>`; }).join('')}</div>${f.help ? `<small>${esc(f.help)}</small>` : ''}</div>`;
    case 'datetime': input = `<input id="${id}" name="${f.k}" type="datetime-local" value="${esc(v)}">`; break;
    default: input = `<input id="${id}" name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}"${f.t === 'number' ? ' step="any"' : ''}>`;
  }
  return `<div class="field${f.full || f.t === 'textarea' ? ' full' : ''}">${lab}${input}${f.help ? `<small>${esc(f.help)}</small>` : ''}</div>`;
}
function collect(form, fields) {
  const out = {};
  for (const f of fields) {
    if (f.t === 'h') continue;
    if (f.t === 'check') out[f.k] = form.elements[f.k].checked;
    else if (f.t === 'multi') out[f.k] = [...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i => i.value);
    else {
      let v = form.elements[f.k].value.trim();
      if (f.t === 'money') v = v === '' ? null : parseMoney(v);
      if (f.t === 'number') v = v === '' ? null : Number(v);
      out[f.k] = v;
    }
  }
  return out;
}
function validate(fields, d) {
  for (const f of fields) {
    if (f.t === 'h') continue;
    const v = d[f.k];
    if (f.req && (v == null || v === '' || v === false || (Array.isArray(v) && !v.length))) return `${f.l} is required.`;
    if (f.t === 'money' && v != null && isNaN(v)) return `${f.l} must be an amount, like 125.00.`;
    if (f.t === 'money' && v != null && v < 0) return `${f.l} can’t be negative.`;
    if (f.t === 'url' && v && !/^https:\/\/\S+$/i.test(v)) return `${f.l} must be an HTTPS link.`;
    if (f.t === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return `${f.l} must be a valid email address.`;
    if (f.t === 'number' && v != null && isNaN(v)) return `${f.l} must be a number.`;
  }
}
function modal(title, bodyHtml, { onSubmit, submitLabel = 'Save', size = '', extraButtons = '' } = {}) {
  const dlg = document.createElement('dialog');
  dlg.className = 'modal ' + size;
  dlg.innerHTML = `<form novalidate><header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></header><div class="body">${bodyHtml}</div><p class="err" role="alert"></p><footer>${extraButtons}<button type="button" class="btn ghost" data-close>${onSubmit ? 'Cancel' : 'Close'}</button>${onSubmit ? `<button type="submit" class="btn primary">${esc(submitLabel)}</button>` : ''}</footer></form>`;
  document.body.append(dlg);
  const form = dlg.querySelector('form');
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!onSubmit) return close();
    const err = onSubmit(form);
    if (err) { dlg.querySelector('.err').textContent = err; }
    else { save(); close(); render(); }
  });
  dlg.showModal();
  const firstInput = dlg.querySelector('.body input:not([type=hidden]),.body select,.body textarea');
  if (firstInput) firstInput.focus();
  return { dlg, form, close };
}
function formModal(title, fields, values, onSave, opts = {}) {
  const v = values || {};
  const body = (opts.intro || '') + `<div class="fgrid">${fields.map(f => fieldHtml(f, v[f.k] !== undefined ? v[f.k] : (typeof f.def === 'function' ? f.def() : f.def))).join('')}</div>${opts.note ? `<p class="note">${opts.note}</p>` : ''}`;
  return modal(title, body, { ...opts, onSubmit: form => { const d = collect(form, fields); return validate(fields, d) || onSave(d, form); } });
}
function confirmModal(title, text, label, fn) { modal(title, `<p style="margin:0">${text}</p>`, { submitLabel: label, size: 'narrow', onSubmit: () => fn() }); }

function pipelineTotals(list) {

  list.forEach(o => { if (o.value == null) return; expected[o.currency] = (expected[o.currency] || 0) + o.value; weighted[o.currency] = (weighted[o.currency] || 0) + Math.round(o.value * (Number(o.probability) || 0) / 100); });
  return { expected, weighted };
}

function alerts() {
  const m = me(), t = today(), out = [];
  const add = (key, title, detail, due, link, kind) => out.push({ key, title, detail, due, link, kind });
  S.tasks.filter(x => x.assigneeId === m.id && !['Published', 'Completed'].includes(x.status) && x.due && x.due <= addDays(1))
    .forEach(x => add(`task:${x.id}:${x.due}`, x.due < t ? 'Overdue work' : x.due === t ? 'Work due today' : 'Work due tomorrow', x.title, x.due, '#/work', 'Work'));
  followQueue().filter(f => f.ownerId === m.id && f.followUp <= t)
    .forEach(f => add(`fu:${f.id}:${f.followUp}`, f.followUp < t ? 'Overdue follow-up' : 'Follow-up due today', `${f.name}${f.nextAction ? ' — ' + f.nextAction : ''}`, f.followUp, '#/followups', 'Follow-up'));
  if (hasFirm(m)) {
    S.pncs.filter(p => !PNC_DONE.includes(p.status)).forEach(p => {
      if (p.followUp && p.followUp <= t) add(`pnc:${p.id}:${p.followUp}`, 'PNC follow-up due', `${p.name}${p.nextAction ? ' — ' + p.nextAction : ''}`, p.followUp, '#/pnc/' + p.id, 'PNC');
      [['limitationDate', 'Limitation date'], ['noticeDate', 'Notice date']].forEach(([k, l]) => {
        if (p[k] && p[k] >= t && p[k] <= addDays(30)) add(`pnc${k}:${p.id}:${p[k]}`, `${l} approaching`, `${p.name} — ${fmtDate(p[k])} (verified by ${p.verifiedBy || '—'})`, p[k], '#/pnc/' + p.id, 'PNC');
      });
    });
  }
  S.programs.filter(p => p.status === 'Active' && p.renewal && p.renewal >= t && p.renewal <= addDays(14) && canSeeProgram(p) && (isAdmin(m) || p.accountOwner === m.id))
    .forEach(p => add(`renew:${p.id}:${p.renewal}`, 'Program renewal coming up', `${p.provider} renews ${fmtDate(p.renewal)} · ${money(p.amount, p.currency)}`, p.renewal, p.kind === 'office' ? '#/oprograms' : '#/mprograms', 'Renewal'));
  const wd = dow(t), h = nyHour();
  if (wd >= 1 && wd <= 5 && h >= 17 && !S.reports.some(r => r.staffId === m.id && r.kind === 'Daily' && r.scope === 'General' && r.start === t && r.status !== 'Draft'))
    add(`daily:${t}`, 'Daily update not submitted', 'The 5 p.m. New York cutoff has passed.', t, '#/reports', 'Report');
  const wk = mondayOf(t);
  if (((wd === 5 && h >= 17) || wd === 6 || wd === 0) && !S.reports.some(r => r.staffId === m.id && r.kind === 'Weekly' && r.scope === 'General' && r.start === wk && r.status !== 'Draft'))
    add(`weekly:${wk}`, 'Weekly update not submitted', 'Weekly updates open Friday at 5 p.m. New York time.', t, '#/reports', 'Report');
  (S.divContacts || []).filter(c => c.ownerId === m.id && c.status !== 'Archived' && c.followUp && c.followUp <= t && hasDiv(c.division, m))
    .forEach(c => add(`dc:${c.id}:${c.followUp}`, `${DIV[c.division].name} follow-up`, `${c.name}${c.nextAction ? ' — ' + c.nextAction : ''}`, c.followUp, '#/dcontacts/' + c.division, 'Follow-up'));
  S.reminders.filter(r => r.status === 'Open' && r.assigneeId === m.id && r.due <= t && (r.scope !== 'Firm' || hasFirm(m)))
    .forEach(r => add(`rem:${r.id}:${r.due}`, 'Reminder', r.title, r.due, '#/attention', 'Reminder'));
  return out.map(a => {
    const st = S.alertStates[m.id + '|' + a.key];
    let state = st?.state || 'new';
    if (state === 'snoozed' && st.until <= t) state = 'new'; // snoozes expire by business date
    return { ...a, state };
  }).filter(a => a.state !== 'dismissed' && a.state !== 'snoozed').sort((x, y) => (x.due || '').localeCompare(y.due || ''));
}

function utmUrl(k) {
  if (!k.landingUrl) return '';
  try { const u = new URL(k.landingUrl); if (k.utmSource) u.searchParams.set('utm_source', k.utmSource); if (k.utmMedium) u.searchParams.set('utm_medium', k.utmMedium); u.searchParams.set('utm_campaign', slug(k.name)); return u.toString(); } catch (e) { return ''; }

function campaignResults(k) {
  const contacts = S.contacts.filter(c => c.campaignId === k.id).length;

  const spend = sumByCur(S.expenses.filter(e => e.scope === 'marketing' && e.campaignId === k.id && e.state !== 'Voided'));
  const same = spend[k.currency] || 0;

}

function pgCalendar() {
  const t = today(), ym = UI.calMonth || t.slice(0, 7);
  const firm = UI.calFirm && hasFirm();
  const items = {};
  const add = (date, label, cls, href) => { if (date && date.slice(0, 7) === ym) (items[date] = items[date] || []).push({ label, cls, href }); };
  if (hasDiv('marketing')) {
    S.campaigns.forEach(k => { add(k.start, 'Starts: ' + k.name, 'campaign', '#/campaigns'); add(k.end, 'Ends: ' + k.name, 'campaign', '#/campaigns'); });
    followQueue().forEach(f => add(f.followUp, 'Follow up: ' + f.name, 'follow', f.link));
  }
  S.tasks.filter(x => x.status !== 'Completed').forEach(x => add(x.due, x.title, 'work', '#/work'));
  S.divContacts.filter(c => c.status !== 'Archived' && c.followUp && hasDiv(c.division) && (c.division !== 'jdco' || firm)).forEach(c => add(c.followUp, 'Follow up: ' + c.name, c.division === 'jdco' ? 'firm' : 'follow', '#/dcontacts/' + c.division));
  if (firm) S.pncs.forEach(p => { add(p.followUp, 'PNC: ' + p.name, 'firm', '#/pnc/' + p.id); add(p.limitationDate, 'Limitation: ' + p.name, 'firm', '#/pnc/' + p.id); add(p.noticeDate, 'Notice: ' + p.name, 'firm', '#/pnc/' + p.id); });
  const firstDay = ym + '-01', startCell = mondayOf(firstDay);
  const cells = [];
  for (let i = 0; i < 42; i++) { const ds = shift(startCell, i); if (i % 7 === 0 && i >= 28 && ds.slice(0, 7) !== ym) break; cells.push(ds); }
  const prevM = shift(firstDay, -1).slice(0, 7), nextM = shift(firstDay, 32).slice(0, 7);
  return head('Team calendar', 'Campaign dates, work deadlines and marketing follow-ups. There’s no sync with an outside calendar.') +
    `<div class="toolbar"><button type="button" class="btn sm" data-act="setui" data-k="calMonth" data-v="${prevM}" aria-label="Previous month">‹</button><strong style="min-width:150px;text-align:center">${fmtMonth(ym)}</strong><button type="button" class="btn sm" data-act="setui" data-k="calMonth" data-v="${nextM}" aria-label="Next month">›</button><button type="button" class="btn sm ghost" data-act="setui" data-k="calMonth" data-v="${t.slice(0, 7)}">Today</button>
    ${hasFirm() ? `<label class="chk" style="margin-left:auto"><input type="checkbox" data-ui="calFirm"${UI.calFirm ? ' checked' : ''}> Include firm PNC and legal dates</label>` : ''}</div>
    <div class="cal"><div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="dow">${x}</div>`).join('')}
    ${cells.map(ds => `<div class="day${ds.slice(0, 7) !== ym ? ' out' : ''}${ds === t ? ' today' : ''}"><span class="n">${Number(ds.slice(8))}</span>${(items[ds] || []).map(it => `<a class="chip ${it.cls}" href="${it.href}" title="${esc(it.label)}">${esc(it.label)}</a>`).join('')}</div>`).join('')}</div></div>
    <div class="legend"><span style="--c:var(--violet)">Campaign</span><span style="--c:#111">Work</span><span style="--c:var(--pink)">Follow-up</span>${firm ? '<span style="--c:var(--warn)">Firm (restricted)</span>' : ''}</div>`;
}

ACT.saveReport = d => {
  const m = me(), kind = UI.repKind || 'Daily', scope = hasFirm() ? (UI.repScope || 'General') : 'General';
  const [start, end] = periodRange(kind, UI.repDate || today());
  const form = $('#repForm'), data = {};
  REPORT_PARTS.forEach(([k]) => { data[k] = form.elements[k].value.trim(); });
  const r = reportFor(m.id, kind, scope, start);
  if (r && String(r.rev) !== form.dataset.rev) return alertBox('This update was changed somewhere else. Refresh and try again.');
  if (d.submit && !REPORT_PARTS.some(([k]) => data[k])) return alertBox('Write at least one section before submitting.');
  const inP = iso => { const ds = nyFmt.format(new Date(iso)); return ds >= start && ds <= end; };
  const counters = {
    tasksDone: S.tasks.filter(x => x.assigneeId === m.id && ['Completed', 'Published'].includes(x.status) && x.updatedAt && inP(x.updatedAt)).length,
    activities: S.activities.filter(a => a.actor === m.id && inP(a.at)).length,
    attempts: S.attempts.filter(a => a.actor === m.id && !a.importedStaff && inP(a.at)).length,

ACT.startChecklist = d => {
  let added = 0;
  CHECKLIST.forEach(([k]) => { if (!S.checklist.some(x => x.matterId === d.id && x.item === k)) { S.checklist.push({ id: uid(), matterId: d.id, item: k, status: 'Not started', rev: 1 }); added++; } });
  log('Started opening checklist', byId('matters', d.id).fileNumber, 'firm'); save(); render(); toast(`${added} items added. Existing progress kept.`);
};
ACT.editCheck = d => {
  const x = byId('checklist', d.id), openedRev = x.rev;
  formModal(x.item, [
    { k: 'status', l: 'Status', t: 'select', blank: false, o: ['Not started', 'In progress', 'Complete', 'Not applicable'] },
    { k: 'assigneeId', l: 'Assignee', t: 'select', o: memberOpts(true) },
    { k: 'notes', l: 'Review notes', t: 'textarea', help: 'Required for Complete or Not applicable.' },
    { k: 'evidence', l: 'Evidence or Box link', t: 'url', full: true },
  ], x, v => {
    const cur = byId('checklist', d.id);
    if (cur.rev !== openedRev) return 'Someone saved this item after you opened it. Close and reopen it to see the latest version.';
    if (['Complete', 'Not applicable'].includes(v.status) && !v.notes) return 'Add a note explaining the review or the reason.';
    if (v.assigneeId) { const a = byId('members', v.assigneeId); if (!a?.active || !hasFirm(a)) return 'Assignees must be active staff with firm access.'; }
    const resolved = s => ['Complete', 'Not applicable'].includes(s);
    if (resolved(v.status) && !resolved(cur.status)) { cur.completedBy = me().name; cur.completedAt = nowISO(); }
    if (!resolved(v.status)) { cur.completedBy = null; cur.completedAt = null; }
    Object.assign(cur, v, { updatedByName: me().name, updatedAt: nowISO(), rev: cur.rev + 1 });
    log('Updated checklist: ' + cur.item, byId('matters', cur.matterId).fileNumber, 'firm');

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function checkImportRow(target, r, seen) {
  const lc = s => String(s || '').trim().toLowerCase();
  const badDate = ['dob', 'lossDate', 'opened', 'closed', 'followUp', 'date', 'paidDate'].find(k => r[k] && !isDate(r[k]));
  if (badDate) return ['Error', `${badDate} must be YYYY-MM-DD`];
  if (target === 'contacts') {
    if (!r.name) return ['Error', 'Name is required'];
    if (r.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) return ['Error', 'Invalid email'];
    if (r.email && (S.contacts.some(c => lc(c.email) === lc(r.email)) || seen.has(lc(r.email)))) return ['Duplicate', 'Email already in contacts'];
    if (r.email) seen.add(lc(r.email));
  } else if (target === 'clients') {
    if (!r.name) return ['Error', 'Name is required'];
    if (r.email && (S.clients.some(c => lc(c.email) === lc(r.email)) || seen.has(lc(r.email)))) return ['Duplicate', 'Email matches an existing client'];
    if (S.clients.some(c => lc(c.name) === lc(r.name) && r.dob && c.dob === r.dob)) return ['Duplicate', 'Name and DOB match an existing client'];
    if (r.email) seen.add(lc(r.email));
  } else if (target === 'matters') {
    if (!r.client || !r.fileNumber || !r.caseType || !r.lawyer) return ['Error', 'client, fileNumber, caseType and lawyer are required'];
    let m = S.clients.filter(c => c.id === r.client || lc(c.email) === lc(r.client) || lc(c.name) === lc(r.client));
    if (m.length > 1 && r.dob) m = m.filter(c => c.dob === r.dob);
    if (!m.length) return ['Error', 'No matching client (import clients first)'];
    if (m.length > 1) return ['Error', 'More than one client matches; use the Client ID'];
    const law = S.counsel.filter(l => l.id === r.lawyer || lc(l.name) === lc(r.lawyer));
    if (law.length !== 1) return ['Error', 'Lawyer not found in the lawyer directory'];
    if (S.matters.some(x => lc(x.fileNumber) === lc(r.fileNumber)) || seen.has(lc(r.fileNumber))) return ['Duplicate', 'File number already exists'];
    if ((r.status || 'Open') === 'Closed' && !r.closed) return ['Error', 'Closed files need a closed date'];
    seen.add(lc(r.fileNumber));
    r._clientId = m[0].id; r._lawyerId = law[0].id;
  } else if (target === 'dcontacts') {
    if (!r.name) return ['Error', 'Name is required'];
    if (r.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) return ['Error', 'Invalid email'];
    const key = r._div + '|' + lc(r.email);
    if (r.email && (S.divContacts.some(c => c.division === r._div && lc(c.email) === lc(r.email)) || seen.has(key))) return ['Duplicate', 'Email already in this division'];
    if (r.email) seen.add(key);
  } else if (target === 'cexpenses') {
    const mt = S.matters.find(x => lc(x.fileNumber) === lc(r.fileNumber));
    if (!mt) return ['Error', 'No matter with this file number (import matters first)'];
    if (!r.date) return ['Error', 'date is required'];
    if (!r.provider) return ['Error', 'provider is required'];
    const amt = parseMoney(r.amount), hst = r.hst ? parseMoney(r.hst) : 0;
    if (isNaN(amt)) return ['Error', 'amount must be a number'];
    if (isNaN(hst)) return ['Error', 'hst must be a number'];
    const cur = (r.currency || 'CAD').toUpperCase();
    if (!CURS.includes(cur)) return ['Error', 'currency must be CAD or USD'];
    const pay = r.payStatus || 'Unknown';
    if (!['Unpaid', 'Paid', 'Reimbursed', 'Unknown'].includes(pay)) return ['Error', 'payStatus must be Unpaid, Paid, Reimbursed or Unknown'];
    if (r.receipt && !/^https:\/\//i.test(r.receipt)) return ['Error', 'receipt must be an HTTPS link'];
    const key = [mt.id, r.date, lc(r.provider), amt, hst, lc(r.reference), lc(r.description)].join('|');
    if (S.expenses.some(e => e.scope === 'client' && [e.matterId, e.date, lc(e.provider), e.amount, e.hst, lc(e.ref), lc(e.description)].join('|') === key) || seen.has(key)) return ['Duplicate', 'Same expense already recorded'];
    seen.add(key);
    r._matterId = mt.id; r._amount = amt; r._hst = hst; r._currency = cur; r._pay = pay;
  } else if (target === 'pncs') {
    if (!r.name) return ['Error', 'Name is required'];
    const key = lc(r.email) || r.phone;
    if (key && (S.pncs.some(p => (r.email && lc(p.email) === lc(r.email)) || (r.phone && p.phone === r.phone)) || seen.has(key))) return ['Duplicate', 'Email or phone matches an existing PNC'];
    if (key) seen.add(key);
  }
  return ['Ready', ''];
}

ACT.impCommit = d => {

  if (b.createdBy !== me().id) return alertBox('Only the person who created a batch can commit it.');
  const sel = new Set([...document.querySelectorAll('.impSel:checked')].map(x => x.value));
  if (!sel.size) return alertBox('Select at least one Ready row.');
  if (b.target === 'contacts' && !byId('members', b.ownerId)?.active) return alertBox('The relationship owner is no longer active.');
  const seen = new Set(); let added = 0;

    if (!sel.has(r.rowId)) { r.status = 'Skipped'; return; }
    const [st, msg] = checkImportRow(b.target, r.data, seen);
    if (st !== 'Ready') { r.status = st; r.msg = msg + ' (rechecked at commit)'; return; }
    const x = r.data;
    if (b.target === 'contacts') { const co = x.company && S.companies.find(c => c.name.toLowerCase() === x.company.toLowerCase()); upsert('contacts', { name: x.name, email: x.email, phone: x.phone, companyId: co?.id || '', role: x.role, source: x.source || 'Import', notes: x.notes, brands: [b.brand], ownerId: b.ownerId, emailPref: 'Unknown', status: 'Active', importBatch: b.id }); }
    if (b.target === 'clients') upsert('clients', { name: x.name, email: x.email, phone: x.phone, dob: x.dob, address: x.address, instructions: x.instructions, importBatch: b.id });
    if (b.target === 'matters') upsert('matters', { clientId: x._clientId, fileNumber: x.fileNumber, caseType: x.caseType, lawyerId: x._lawyerId, lossDate: x.lossDate, status: x.status || 'Open', opened: x.opened, closed: x.closed, notes: x.notes, importBatch: b.id });
    if (b.target === 'cexpenses') upsert('expenses', { scope: 'client', matterId: x._matterId, date: x.date, provider: x.provider, description: x.description, category: x.category, ref: x.reference, currency: x._currency, amount: x._amount, hst: x._hst, payStatus: x._pay, paidDate: x.paidDate, receipt: x.receipt, notes: x.notes, bookStatus: 'Not submitted', state: 'Recorded', importBatch: b.id });
    if (b.target === 'dcontacts') upsert('divContacts', { division: x._div, name: x.name, email: x.email, phone: x.phone, organization: x.organization, role: x.role, notes: x.notes, ownerId: b.ownerId, status: 'Active', importBatch: b.id });
    if (b.target === 'pncs') upsert('pncs', { name: x.name, phone: x.phone, email: x.email, source: x.source, caseType: x.caseType, lossDate: x.lossDate, nextAction: x.nextAction, followUp: x.followUp, status: 'New', urgency: 'Normal', importBatch: b.id });
    r.status = 'Committed'; added++;
  });
  b.committed = true; b.committedAt = nowISO();
  log('Committed import batch', `${IMPORT_TARGETS[b.target].l}: ${added} records`, IMPORT_TARGETS[b.target].firm ? 'firm' : 'general');
  save(); render(); toast(`${added} record${added === 1 ? '' : 's'} imported.`);
};

/* ---------- Division contact directories ---------- */
const divMemberOpts = divId => () => activeMembers().filter(m => hasDiv(divId, m)).map(m => [m.id, m.name]);
function pgDivContacts(divId) {
  const d = DIV[divId], t = today();
  const rows = S.divContacts.filter(c => c.division === divId && (UI.dcArchived || c.status !== 'Archived')).sort((a, b) => a.name.localeCompare(b.name));
  const sub = divId === 'jdco' ? 'People the firm works with, such as doctors, adjusters and other lawyers. Clients have their own directory.' : `Contacts for ${esc(d.name)}. Only staff with access to this division can see them.`;
  return head(`${d.name} contacts`, sub, btn('Add contact', 'editDivContact', { div: divId }, 'primary')) +
    `<div class="toolbar">${searchBox('tbl-dc-' + divId, 'Search name, email, organization')}<label class="chk"><input type="checkbox" data-ui="dcArchived"${UI.dcArchived ? ' checked' : ''}> Show archived</label></div>` +
    table('tbl-dc-' + divId, [
      { l: 'Name', v: c => `<strong>${esc(c.name)}</strong><div class="muted">${esc(c.email || '')}</div>` },
      { l: 'Organization', v: c => esc(c.organization || '—') + (c.role ? `<div class="muted">${esc(c.role)}</div>` : '') },
      { l: 'Phone', v: c => esc(c.phone || '—') }, { l: 'Owner', v: c => memberName(c.ownerId) },
      { l: 'Next action', v: c => c.nextAction ? `${esc(c.nextAction)}<div class="muted"${c.followUp && c.followUp < t ? ' style="color:var(--bad)"' : ''}>${fmtDate(c.followUp)}</div>` : '—' },
      { l: 'Status', v: c => sp(c.status) },
      { l: '', v: c => `<div class="acts-cell">${editBtn('editDivContact', c.id)}</div>` },
    ], rows, { empty: `No ${d.name} contacts yet. Select Add contact to create the first one.` });
}
ACT.editDivContact = d => {
  const prev = d.id ? byId('divContacts', d.id) : null, divId = prev?.division || d.div;
  if (!hasDiv(divId)) return alertBox('You don’t have access to this division.');
  formModal(prev ? 'Edit contact' : `Add ${DIV[divId].name} contact`, [
    { k: 'name', l: 'Name', req: true }, { k: 'organization', l: 'Organization' },
    { k: 'role', l: 'Role or title' }, { k: 'email', l: 'Email', t: 'email' }, { k: 'phone', l: 'Phone', t: 'tel' },
    { k: 'ownerId', l: 'Staff owner', t: 'select', req: true, o: divMemberOpts(divId) },
    { k: 'nextAction', l: 'Next action' }, { k: 'followUp', l: 'Follow-up date', t: 'date' },
    { k: 'status', l: 'Status', t: 'select', blank: false, o: ['Active', 'Archived'] },
    { k: 'notes', l: 'Notes', t: 'textarea' },
  ], prev || { ownerId: me().id, status: 'Active' }, (v, form) => {
    const changed = v.email && v.email.toLowerCase() !== (prev?.email || '').toLowerCase();
    const dup = changed && S.divContacts.find(c => c.id !== prev?.id && c.division === divId && (c.email || '').toLowerCase() === v.email.toLowerCase());
    if (dup && form.dataset.dupOk !== v.email.toLowerCase()) { form.dataset.dupOk = v.email.toLowerCase(); return `${dup.name} already uses ${v.email} in this division. Select Save again if that’s intentional.`; }
    upsert('divContacts', { ...v, division: divId, id: prev?.id });
    log(prev ? 'Updated contact' : 'Added contact', `${DIV[divId].name}: ${v.name}`, divId === 'jdco' ? 'firm' : 'general');
  });
};

/* ---------- Document folders ---------- */
const FOLDER_KINDS = ['Document', 'Template', 'Policy', 'Form', 'Manuscript', 'Image', 'Link', 'Note'];
const canSeeFolder = f => !!f && (!f.div || hasDiv(f.div));
function pgFolder(fid) {
  const f = FOLDER[fid];
  if (!f) return head('Folder not found');
  const rows = S.folderItems.filter(x => x.folder === fid).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  return head(f.name, `${esc(f.area)} · ${esc(f.about)}`, btn('Add item', 'editFolderItem', { folder: fid }, 'primary')) +
    `<div class="infobox">Files stay in Box. Add each item with its Box link so the team can open it from here.</div>
    <div class="toolbar">${searchBox('tbl-f-' + fid, 'Search ' + f.name)}</div>` +
    table('tbl-f-' + fid, [
      { l: 'Item', v: x => `<strong>${esc(x.title)}</strong>${x.notes ? `<div class="muted">${esc(x.notes)}</div>` : ''}` },
      { l: 'Type', v: x => pill(x.kind) }, { l: 'Status', v: x => sp(x.status) },
      { l: 'Owner', v: x => memberName(x.ownerId) }, { l: 'Updated', v: x => fmtDT(x.updatedAt || x.createdAt) },
      { l: 'Link', v: x => x.link ? ext(x.link, 'Open in Box') : '<span class="muted">No link yet</span>' },
      { l: '', v: x => `<div class="acts-cell">${editBtn('editFolderItem', x.id)}</div>` },
    ], rows, { empty: `Nothing in ${f.name} yet. Select Add item to add the first one.` });
}
ACT.editFolderItem = d => {
  const prev = d.id ? byId('folderItems', d.id) : null, fid = prev?.folder || d.folder, f = FOLDER[fid];
  if (!canSeeFolder(f)) return alertBox('You don’t have access to this folder.');
  formModal(prev ? 'Edit item' : `Add to ${f.name}`, [
    { k: 'title', l: 'Title', req: true, full: true },
    { k: 'kind', l: 'Type', t: 'select', blank: false, o: FOLDER_KINDS },
    { k: 'status', l: 'Status', t: 'select', blank: false, o: ['Draft', 'In review', 'Final'] },
    { k: 'link', l: 'Box link', t: 'url', full: true, help: 'Paste the HTTPS link from Box.' },
    { k: 'ownerId', l: 'Owner', t: 'select', req: true, o: f.div ? divMemberOpts(f.div) : memberOpts() },
    { k: 'notes', l: 'Notes', t: 'textarea' },
  ], prev || { kind: 'Document', status: 'Draft', ownerId: me().id }, v => {
    upsert('folderItems', { ...v, folder: fid, id: prev?.id });
    log(prev ? 'Updated item' : 'Added item', `${f.name}: ${v.title}`);
  }, { size: 'narrow' });
};

/* ---------- People and access ---------- */
const divPills = x => x.role === 'Owner' ? pill('All divisions', 'info') : (x.divisions || []).length ? `<div class="tags">${DIVISIONS.filter(d => x.divisions.includes(d.id)).map(d => pill(d.name, d.id === 'jdco' ? 'info' : '')).join('')}</div>` : '<span class="muted">None yet</span>';
function canManage(x) { const m = me(); if (x.role === 'Owner') return false; if (isOwner(m)) return true; return m.role === 'Administrator' && x.role === 'Member'; }
function pgPeople() {
  const m = me();
  return head('People and access', 'Momentum membership. Hosting access is a separate control, and adding someone here doesn’t send an invitation.', btn('Add staff member', 'editMember', {}, 'primary')) +
    `<div class="infobox">Add each person with the exact email they sign in with. Their membership binds on first sign-in. Give each person the divisions they work on; they only see those divisions. Only Jasmine can grant the restricted divisions (JD&amp;Co Law Firm, Accounting and JD Publishing) or manage administrators.</div>` +
    table('tbl-ppl', [
      { l: 'Name', v: x => `<strong>${esc(x.name)}</strong>${x.id === m.id ? ' <span class="muted">(you)</span>' : ''}<div class="muted">${esc(x.email || 'Sign-in email not added')}</div>` },
      { l: 'Title', v: x => x.title ? esc(x.title) : '<span class="muted">Not added yet</span>' },
      { l: 'Role', v: x => sp(x.role) }, { l: 'Divisions', v: divPills },
      { l: 'Sign-in', v: x => x.bound ? pill('Bound', 'ok') : pill('Pending first sign-in', 'warn') },
      { l: 'Status', v: x => x.active ? sp('Active') : pill('Deactivated', 'bad') },
      { l: '', v: x => canManage(x) ? `<div class="acts-cell">${editBtn('editMember', x.id)}</div>` : '' },
    ], S.members) +
    `<section class="card" style="margin-top:16px"><h3>Audit log ${btn('Reset demo data', 'reset', {}, 'sm danger')}</h3>${auditList(25)}</section>`;
}
ACT.editMember = d => {
  const prev = d.id ? byId('members', d.id) : null, owner = isOwner();
  const fields = [
    { k: 'name', l: 'Name', req: true }, { k: 'title', l: 'Title' },
    { k: 'email', l: 'Sign-in email', t: 'email', full: true, help: 'Needed before this person can sign in to the real app.' },
    { k: 'role', l: 'Role', t: 'select', blank: false, o: owner ? ['Member', 'Administrator'] : ['Member'] },
    { k: 'divisions', l: 'Division access', t: 'multi', def: [], o: DIVISIONS.filter(x => owner || !RESTRICTED.includes(x.id)).map(x => [x.id, x.name + (RESTRICTED.includes(x.id) ? ' (restricted)' : '')]), help: owner ? 'Restricted divisions hold sensitive records. Only you can grant them.' : 'Only Jasmine can grant JD&Co Law Firm, Accounting or JD Publishing.' },
    { k: 'active', l: 'Active', t: 'check', cl: 'Can use Momentum', def: true },
  ];
  formModal(prev ? 'Edit ' + prev.name : 'Add staff member', fields, prev, v => {
    if (v.email && S.members.some(x => x.id !== prev?.id && (x.email || '').toLowerCase() === v.email.toLowerCase())) return 'That email already belongs to a member.';
    if (prev && prev.id === me().id && !v.active) return 'You can’t deactivate yourself.';
    if (prev && prev.bound && prev.email && prev.email.toLowerCase() !== v.email.toLowerCase()) return 'This person has already signed in, so their email is bound and can’t be changed here.';
    const keepRestricted = (prev?.divisions || []).filter(x => RESTRICTED.includes(x));
    const divisions = owner ? v.divisions : [...keepRestricted, ...v.divisions.filter(x => !RESTRICTED.includes(x))];
    const r = upsert('members', { ...v, divisions, id: prev?.id, bound: prev?.bound || false });
    log(prev ? 'Updated member' : 'Added member', r.name);
  }, { size: 'narrow' });
};
ACT.myProfile = () => {
  const m = me();
  formModal('My profile', [
    { k: 'title', l: 'Your title', req: true, full: true, help: 'For example Marketing Coordinator or Law Clerk.' },
  ], m, v => { m.title = v.title; m.rev = (m.rev || 1) + 1; log('Updated title', m.name + ': ' + v.title); }, { size: 'narrow', intro: `<p style="margin-top:0"><strong>${esc(m.name)}</strong> · ${esc(m.role)}</p>` });
};
ACT.reset = () => confirmModal('Reset demo data?', 'This replaces everything in this browser with the original sample data.', 'Reset', () => { const who = S.session; S = seed(); S.session = who; });

/* ---------- misc UI ---------- */
function toast(text) {
  const t = document.createElement('div');
  t.setAttribute('role', 'status');
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:calc(100vw - 32px);font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2)';
  t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 3200);
}
function alertBox(text) { modal('Can’t do that yet', `<p style="margin:0">${esc(text)}</p>`, { size: 'narrow' }); }

/* ---------- login ---------- */
function loginHtml(msg) {
  return `<div class="login"><main class="login-card">
    <img class="login-hero" src="img/staircase.jpg" alt="">
    <h1 class="wordmark">MOMENTUM</h1><div class="byline">By Jasmine Daya, Law Girl</div><div class="tagline">Bold ambition creates limitless possibility</div>
    <div class="qcard"><div class="lbl">Today’s inspiration · ${fmtDate(today())}</div><blockquote id="q-login">${esc(quoteToday())}</blockquote></div>
    ${msg ? `<div class="warnbox" role="alert">${esc(msg)}</div>` : ''}
    <div class="who" role="group" aria-label="Choose a demo identity">${S.members.map(p => `<button type="button" data-act="login" data-id="${p.id}"><span><strong>${esc(p.name)}</strong><br><small>${esc(p.title || 'Title not added yet')}</small></span><span class="tags">${sp(p.role)}${p.role === 'Owner' ? pill('All divisions', 'info') : pill(`${(p.divisions || []).length} division${(p.divisions || []).length === 1 ? '' : 's'}`, 'info')}${p.active ? '' : pill('Deactivated', 'bad')}</span></button>`).join('')}</div>
    <p class="proto">Prototype: choose who to sign in as. The real app uses individual ChatGPT sign-in. All sample data is fictional and saved only in this browser.</p>
    <p class="proto"><strong>Version 8 · Client import</strong></p>
  </main></div>`;
}
ACT.login = d => {
  const m = byId('members', d.id);
  if (!m.active) { app.innerHTML = loginHtml(`${m.name}’s membership is deactivated, so access is denied.`); return; }
  S.session = m.id;
  if (!m.bound) { m.bound = true; log('First sign-in bound membership', m.name); }
  save();
  if (location.hash && location.hash !== '#/overview') location.hash = '#/overview'; else render();
};
ACT.logout = () => { S.session = null; save(); history.replaceState(null, '', location.pathname); render(); };
ACT.menu = () => { $('.side')?.classList.toggle('open'); $('.scrim')?.classList.toggle('on'); };

/* ---------- render ---------- */
const app = document.getElementById('app');
function route() { const h = location.hash.replace(/^#\/?/, ''); const [r, id] = h.split('/'); return { r: r || 'overview', id: id && decodeURIComponent(id) }; }
function render() {
  const m = me();
  if (!m) { app.innerHTML = loginHtml(); document.title = 'Momentum'; return; }
  const { r, id } = route();
  const key = PAGES[r] ? r : 'overview', page = PAGES[key];
  const needDiv = page.divFromId ? id : page.folderFromId ? FOLDER[id]?.div : page.div;
  const denied = (needDiv && (!DIV[needDiv] || !hasDiv(needDiv, m))) || (page.admin && !isAdmin(m));
  const body = denied
    ? head('Access denied') + `<section class="card"><p style="margin:0">${page.admin ? 'This area is for administrators.' : `This area needs access to ${esc(DIV[needDiv]?.name || 'this division')}. Jasmine grants division access in People and access.`} Each request is checked, even when someone types the address directly.</p></section>`
    : page.f(id);
  const active = ['dcontacts', 'folder'].includes(key) ? key + '/' + id : (page.nav || key);
  // Brand imagery from the Box "Images" folder, shown as a banner on matching pages.
  const HERO = { overview: 'city', calendar: 'calendar', contacts: 'loops', companies: 'loops', opps: 'loops', followups: 'loops',
    mprograms: 'office', oprograms: 'office', mexpenses: 'marketing-expenses', cexpenses: 'client-expenses', clients: 'client-archive', dcontacts: 'loops' };
  const heroKey = HERO[active] || HERO[key] || (key === 'folder' && FOLDER[id]?.hero);
  const hero = !denied && heroKey ? `<img class="hero-img" src="img/${heroKey}.jpg" alt="">` : '';
  const alertN = alerts().filter(a => a.state !== 'read').length;
  const nav = NAV.filter(g => (!g.div || hasDiv(g.div, m)) && (!g.admin || isAdmin(m))).map(g => `<div class="navg"><h4>${esc(g.g)}${RESTRICTED.includes(g.div) ? ' <span class="lock">Restricted</span>' : ''}</h4>${g.items.map(([k, l]) => k === '__h' ? `<div class="navsub">${esc(l)}</div>` : `<a href="#/${k}" class="${k === active ? 'on' : ''}"${k === active ? ' aria-current="page"' : ''}><span>${esc(l)}</span>${k === 'attention' && alertN ? `<span class="count" aria-label="${alertN} alerts">${alertN}</span>` : ''}</a>`).join('')}</div>`).join('');
  const scrollY = window.scrollY;
  app.innerHTML = `<div class="mbar"><button type="button" class="icon-btn" data-act="menu" aria-label="Open menu">☰</button><span class="wordmark">MOMENTUM</span><a href="#/attention" class="btn sm ghost" aria-label="Alerts">${alertN ? `<span class="count">${alertN}</span>` : 'Alerts'}</a></div>
  <div class="shell"><nav class="side" aria-label="Main"><div class="brand"><div class="wordmark">MOMENTUM</div><div class="byline">By Jasmine Daya, Law Girl</div></div>${nav}
    <div class="side-foot"><div class="me">${esc(m.name)}</div><div class="muted" style="font-size:12px">${esc(m.title || m.role)}</div><div class="row">${btn(m.title ? 'My profile' : 'Add my title', 'myProfile', {}, m.title ? 'sm' : 'sm accent')}${btn('Switch user', 'logout', {}, 'sm')}</div></div></nav>
    <div class="scrim" data-act="menu"></div>
    <main id="main"><div class="banner">Prototype with fictional sample data, saved only in this browser. No real sign-in or server. <strong>Version 8 · Client import</strong></div>${hero}${body}</main></div>`;
  document.querySelectorAll('[data-filter]').forEach(el => { if (el.value) applyFilter(el); });
  document.title = (document.querySelector('.ph h1')?.textContent || 'Overview') + ' · Momentum';
  window.scrollTo(0, UI._lastRoute === location.hash ? scrollY : 0);
  UI._lastRoute = location.hash;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('dialog') && el.dataset.act !== 'copy') return;
  e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn({ ...el.dataset }, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('dialog')) return;
  if (el.id === 'impFile' && el.files[0]) { const f = el.files[0]; if (f.size > 300 * 1024) return alertBox('This file is larger than 300 KB.'); f.text().then(t => { UI.impText = t; render(); }); return; }
  if (el.id === 'impText') { UI.impText = el.value; return; }
  const k = el.dataset?.ui; if (!k) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (k.includes('.')) { const [a, b] = k.split('.'); UI[a] = { ...(UI[a] || {}), [b]: v }; } else UI[k] = v;
  if (k === 'impTarget') UI.impBatch = null;
  render();
});
document.addEventListener('input', e => { if (e.target.dataset?.filter) applyFilter(e.target); });
window.addEventListener('hashchange', () => { $('.side')?.classList.remove('open'); render(); });
// Quote check every 30 s; attention centre refresh every minute (skipped while a dialog is open).
setInterval(() => { const q = quoteToday(); ['q-login', 'q-today'].forEach(id => { const el = document.getElementById(id); if (el && el.textContent !== q) el.textContent = q; }); }, 30000);
setInterval(() => { if (me() && route().r === 'attention' && !document.querySelector('dialog[open]')) render(); }, 60000);

S = load();
if (!S || !S.members) S = seed();
// One-time update for browsers that already opened the page: firm access for Jannelle, Mike and Nerissa (keeps titles people entered).
if (!S.firmRosterV3) {
  ['m5', 'm8'].forEach(id => { const m = byId('members', id); if (m) m.firm = true; });
  if (!byId('members', 'm12')) S.members.splice(8, 0, { id: 'm12', name: 'Nerissa Sison', title: '', email: '', role: 'Member', firm: true, active: true, bound: false, rev: 1 });
  S.firmRosterV3 = true; save();
}
{ const n = byId('members', 'm12'); if (n && n.name === 'Nerissa') { n.name = 'Nerissa Sison'; save(); } }
// One-time update to divisions: everyone keeps Marketing, earlier firm access becomes JD&Co Law Firm, Jasmine gets all.
if (!S.divisionsV4) {
  S.members.forEach(m => { if (!m.divisions) m.divisions = m.role === 'Owner' ? DIVISIONS.map(d => d.id) : ['marketing', ...(m.firm ? ['jdco'] : [])]; delete m.firm; });
  if (!S.divContacts) S.divContacts = seedDivContacts();
  S.divisionsV4 = true; save();
}
// One-time update: Accounting only for Jannelle, JD Publishing only for Cristian (Jasmine sees all), plus Office and Publishing folders.
if (!S.foldersV5) {
  const only = { accounting: 'm5', publishing: 'm4' };
  S.members.forEach(m => {
    if (m.role === 'Owner') return;
    m.divisions = (m.divisions || []).filter(x => !only[x] || only[x] === m.id);
    Object.entries(only).forEach(([d, id]) => { if (m.id === id && !m.divisions.includes(d)) m.divisions.push(d); });
  });
  if (!S.folderItems) S.folderItems = seedFolderItems();
  S.foldersV5 = true; save();
}
render();
</script>
